name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile skill scripts
        run: python -m compileall -q skills/rapid-domain-mastery/scripts

      - name: Smoke-test session CLI
        run: |
          python skills/rapid-domain-mastery/scripts/session.py --help
          python skills/rapid-domain-mastery/scripts/session.py check --help

      - name: Playground end-to-end smoke
        # playground/ is gitignored; smoke must self-scaffold from scripts/.
        run: |
          rm -rf playground
          test ! -e playground
          python scripts/run-playground-smoke.py
          test -d playground/.rdm
          test -f playground/exports/smoke-export/state/session.json
